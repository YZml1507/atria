<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Atria 3D</title>
<style>body{margin:0;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from './three.module.js';

const W = 40, H = 30, SC = 3;               // 网格 40x30, 放大3倍 → 120x90 世界单位
const W2W = (gx, gy) => [(gx - W/2) * SC, (gy - H/2) * SC]; // 网格→世界(x,z)

// ---------- 小镇数据 ----------
const PLACES = {
  "安镇老宅":[2,2,7,6,"#e8c39e"], "周家小院":[10,2,15,6,"#f5cd79"], "赵宅":[18,2,23,6,"#c7ecee"],
  "孙氏裁缝铺":[26,2,31,6,"#f8a5c2"], "李家":[34,2,39,6,"#b8e994"],
  "邮局":[2,10,7,15,"#c0392b"], "五金店":[10,10,15,15,"#808e9b"], "杂货铺":[18,10,23,15,"#8e5b3c"],
  "诊所":[26,10,31,6+9,"#ecf0f1"], "镇学校":[2,20,7,25,"#e58e26"], "镇公园":[10,20,20,25,null],
  "老磨坊酒吧":[26,20,31,25,"#6d4c41"]
};
const ROADS = {"北街":[2,7,39,8],"中街":[2,16,39,17],"南街":[2,26,39,27],"住宅南街":[1,29,39,29],
  "西大道":[8,2,9,27],"中大道":[16,2,17,27],"东大道":[24,2,25,27],"公园道":[21,20,22,25]};
const HOMES = [[2,28,3,29],[5,28,6,29],[8,28,9,29],[11,28,12,29],[14,28,15,29],[17,28,18,29],
  [20,28,21,29],[23,28,24,29],[26,28,27,29],[29,28,30,29],[32,28,33,29],[35,28,36,29],
  [4,25,5,27],[7,25,8,27],[10,25,11,27],[13,25,14,27],[15,25,16,27],[22,25,23,27],[25,25,26,27],[31,25,32,27]];

// ---------- 渲染器 ----------
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(1280, 720);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const skyCv = document.createElement("canvas"); skyCv.width=4; skyCv.height=256;
const sk = skyCv.getContext("2d");
const skyGrad = sk.createLinearGradient(0,0,0,256);
skyGrad.addColorStop(0,"#2b4a7a"); skyGrad.addColorStop(0.45,"#87b5e0");
skyGrad.addColorStop(0.75,"#cfe4f2"); skyGrad.addColorStop(1,"#e8f0e8");
sk.fillStyle=skyGrad; sk.fillRect(0,0,4,256);
const skyTex = new THREE.CanvasTexture(skyCv);
skyTex.colorSpace = THREE.SRGBColorSpace;
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(560, 24, 16),
  new THREE.MeshBasicMaterial({map:skyTex, side:THREE.BackSide, fog:false}));
scene.add(skyDome);
const FOGC = new THREE.Color(0xcfe0ee);
scene.fog = new THREE.Fog(FOGC.getHex(), 300, 620);
const cam = new THREE.PerspectiveCamera(50, 1280/720, 0.1, 1200);

const hemi = new THREE.HemisphereLight(0x8fb8e8, 0x3d5a2f, 0.25);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 0.0);
sun.position.set(-60, 90, -40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-90, right:90, top:70, bottom:-70, far:300});
scene.add(sun);
const amb = new THREE.AmbientLight(0xffffff, 0.06);
scene.add(amb);

// ---------- 地形 ----------
function box(x0,y0,x1,y1){ const [a,b]=W2W(x0,y0),[c,d]=W2W(x1,y1); return {x:(a+c)/2,z:(b+d)/2,w:c-a,d:d-b}; }
const ground = new THREE.Mesh(new THREE.BoxGeometry(W*SC+40, 1, H*SC+40),
  new THREE.MeshStandardMaterial({color:0x6da348, roughness:1}));
ground.position.y = -0.5; ground.receiveShadow = true; scene.add(ground);
for (const [n,r] of Object.entries(ROADS)) {
  const b = box(r[0]-0.15, r[1]-0.15, r[2]+0.15, r[3]+0.15);
  const m = new THREE.Mesh(new THREE.BoxGeometry(b.w, 0.12, b.d),
    new THREE.MeshStandardMaterial({color:0x8d8674, roughness:1}));
  m.position.set(b.x, 0.06, b.z); m.receiveShadow = true; scene.add(m);
}

// ---------- 建筑(墙+屋顶) ----------
function facadeTex(wall, sign) {
  const cv = document.createElement("canvas"); cv.width=256; cv.height=128;
  const c = cv.getContext("2d");
  c.fillStyle = wall; c.fillRect(0,0,256,128);
  c.fillStyle = "rgba(0,0,0,0.18)"; c.fillRect(0,0,256,10);
  for (let r=0;r<2;r++) for (let i=0;i<4;i++) {           // 两排窗
    c.fillStyle = "#3a4a5a"; c.fillRect(28+i*56, 26+r*44, 30, 26);
    c.fillStyle = "#9fc4d8"; c.fillRect(30+i*56, 28+r*44, 26, 22);
    c.fillStyle = "#3a4a5a"; c.fillRect(28+i*56+13, 26+r*44, 4, 26);
    c.fillStyle = "rgba(255,255,255,0.25)"; c.fillRect(30+i*56, 28+r*44, 9, 22);
  }
  c.fillStyle = "#4a3520"; c.fillRect(113, 86, 30, 42);    // 门
  if (sign) { c.font="bold 30px 'Noto Sans SC'"; c.fillStyle="#fff";
    c.textAlign="center"; c.fillStyle="rgba(20,20,26,0.85)"; c.fillRect(64,4,128,34);
    c.fillStyle="#ffd76e"; c.fillText(sign, 128, 30); }
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
function building(b, wall, roofC, hh=4, sign=null) {
  const g = new THREE.Group();
  const hex = wall;
  const tx = facadeTex(hex, sign);
  const matSide = new THREE.MeshStandardMaterial({map:tx, roughness:0.9});
  const matTop  = new THREE.MeshStandardMaterial({color:wall, roughness:0.9});
  const body = new THREE.Mesh(new THREE.BoxGeometry(b.w-0.8, hh, b.d-0.8),
    [matSide,matSide,matTop,matSide,matSide,matSide]);
  body.position.y = hh/2; body.castShadow = body.receiveShadow = true; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(b.w,b.d)*0.62, hh*0.55, 4),
    new THREE.MeshStandardMaterial({color:roofC, flatShading:true}));
  roof.position.y = hh + hh*0.27; roof.rotation.y = Math.PI/4;
  roof.scale.set(b.w/Math.max(b.w,b.d), 1, b.d/Math.max(b.w,b.d));
  roof.castShadow = true; g.add(roof);
  g.position.set(b.x, 0, b.z); scene.add(g); return g;
}
const HOMEC = ["#e8c39e","#f5cd79","#c7ecee","#f8a5c2","#b8e994","#d2dae2","#f19066","#a5b1c2"];
for (const [n, r] of Object.entries(PLACES)) {
  if (!r[4]) continue;
  const hh = n=="邮局" ? 5.2 : n=="老磨坊酒吧" ? 5.5 : n=="诊所" ? 4.5 : 3.6;
  const sign = {"邮局":"邮 局","五金店":"五金店","杂货铺":"杂货铺","诊所":"诊 所",
                "镇学校":"镇学校","老磨坊酒吧":"老磨坊","孙氏裁缝铺":"裁缝铺"}[n]||null;
  building(box(r[0]+0.5, r[1]+0.5, r[2]-0.5, r[3]-0.5), r[4], 0x6b5138, hh, sign);
}
HOMES.forEach((r,i)=> building(box(r[0], r[1], r[2], r[3]-0.2), HOMEC[i%8], 0x4a4a55, 2.6));
// 磨坊风车叶片
const mill = new THREE.Group();
for (let i=0;i<4;i++){
  const bl = new THREE.Mesh(new THREE.BoxGeometry(0.5,7,0.18),
    new THREE.MeshStandardMaterial({color:0xd8cdb5}));
  bl.position.y = 3.5; const arm = new THREE.Group(); arm.add(bl);
  arm.rotation.z = i*Math.PI/2; mill.add(arm);
}
const mb = box(27.5,21,29.5,24); mill.position.set(mb.x, 5.5, mb.z-mb.d/2-0.4);
scene.add(mill);
// 邮局旗杆+门牌
const postbox = box(3.2,11,5.8,14);
const flag = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,7),
  new THREE.MeshStandardMaterial({color:0xdddddd}));
flag.position.set(postbox.x, 3.5, postbox.z); scene.add(flag);
const flagC = new THREE.Mesh(new THREE.BoxGeometry(2.0,1.1,0.08),
  new THREE.MeshStandardMaterial({color:0xe74c3c, emissive:0x441010}));
flagC.position.set(postbox.x+1.0, 6.4, postbox.z); scene.add(flagC);

// ---------- 树木/公园水池 ----------
function tree(x, z, s=1) {
  const g = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18*s,0.24*s,1.4*s,5),
    new THREE.MeshStandardMaterial({color:0x6b4a2e}));
  tr.position.y = 0.7*s; tr.castShadow = true; g.add(tr);
  const l1 = new THREE.Mesh(new THREE.ConeGeometry(1.5*s,2.6*s,6),
    new THREE.MeshStandardMaterial({color:0x3e7a3a, flatShading:true}));
  l1.position.y = 2.4*s; l1.castShadow = true; g.add(l1);
  const l2 = new THREE.Mesh(new THREE.ConeGeometry(1.0*s,1.9*s,6),
    new THREE.MeshStandardMaterial({color:0x4c8f45, flatShading:true}));
  l2.position.y = 3.9*s; l2.castShadow = true; g.add(l2);
  g.position.set(x,0,z); scene.add(g);
}
let rs = 12345; const rnd = () => (rs = (rs*1103515245+12345)>>>0) / 4294967296;
for (let i=0;i<8;i++) { const b=box(10.8,20.6,19.2,24.4); tree(b.x-b.w/2+rnd()*b.w, b.z-b.d/2+rnd()*b.d, 0.9+rnd()*0.5); }
[[3.2,17.6],[20,8.6],[33,17.5],[36,25.5],[1.5,25.8],[22,17.6]].forEach(p=>{const[a,b]=W2W(p[0],p[1]);tree(a,b,0.8+rnd()*0.4)});
for (let i=0;i<26;i++) {                                   // 草地深浅斑块
  const gx=rnd()*W, gy=rnd()*H, [px,pz]=W2W(gx,gy);
  const inRoad = Object.values(ROADS).some(r=>gx>=r[0]-0.3&&gx<=r[2]+0.3&&gy>=r[1]-0.3&&gy<=r[3]+0.3);
  const inB = Object.values(PLACES).some(r=>r[0]&&gx>=r[0]-0.3&&gx<=r[2]+0.3&&gy>=r[1]-0.3&&gy<=r[3]+0.3);
  if (inRoad||inB) continue;
  const patch = new THREE.Mesh(new THREE.CylinderGeometry(1.6+rnd()*3,1.6+rnd()*3,0.09,8),
    new THREE.MeshStandardMaterial({color: rnd()<0.5?0x64963f:0x79b052, roughness:1}));
  patch.position.set(px,0.045,pz); patch.receiveShadow=true; scene.add(patch);
}
for (let i=0;i<14;i++) {                                    // 边缘行道树
  const gx = rnd()<0.5 ? 0.6+rnd()*1 : 37+rnd()*2, gy = 1+rnd()*27;
  const inRoad = Object.values(ROADS).some(r=>gx>=r[0]-0.3&&gx<=r[2]+0.3&&gy>=r[1]-0.3&&gy<=r[3]+0.3);
  if (inRoad) continue; const [px,pz]=W2W(gx,gy); tree(px,pz,0.7+rnd()*0.5);
}
for (let i=0;i<20;i++) {                                    // 灌木球
  const gx=rnd()*W, gy=rnd()*H;
  const inRoad = Object.values(ROADS).some(r=>gx>=r[0]-0.3&&gx<=r[2]+0.3&&gy>=r[1]-0.3&&gy<=r[3]+0.3);
  const inB = Object.values(PLACES).some(r=>r[0]&&gx>=r[0]-0.3&&gx<=r[2]+0.3&&gy>=r[1]-0.3&&gy<=r[3]+0.3);
  if (inRoad||inB) continue;
  const [px,pz]=W2W(gx,gy);
  const bush = new THREE.Mesh(new THREE.SphereGeometry(0.5+rnd()*0.4,6,5),
    new THREE.MeshStandardMaterial({color:0x4c8f45, flatShading:true}));
  bush.position.set(px,0.35,pz); bush.castShadow=true; scene.add(bush);
}
const pond = new THREE.Mesh(new THREE.CylinderGeometry(4.5,4.5,0.15,20),
  new THREE.MeshStandardMaterial({color:0x74b9ff, roughness:0.3}));
const pb = box(10,20,20,25); pond.position.set(pb.x, 0.08, pb.z); scene.add(pond);

// ---------- 人物 ----------
const PCOL = [0xe74c3c,0x3498db,0x2ecc71,0xf39c12,0x9b59b6,0x1abc9c,0xe67e22,0xfd79a8,
  0x6c5ce7,0x00b894,0xd63031,0x0984e3,0x00cec9,0xe17055,0xfdcb6e,0x81ecec,0xff7675,
  0x55efc4,0xa29bfe,0xfab1a0,0xffeaa7,0x74b9ff,0x636e72,0xb2bec3,0xdfe6e9];
function person(c) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.5,1.5,8),
    new THREE.MeshStandardMaterial({color:c, roughness:0.85}));
  body.position.y = 0.85; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4,10,8),
    new THREE.MeshStandardMaterial({color:0xf6d7b0}));
  head.position.y = 1.95; head.castShadow = true; g.add(head);
  scene.add(g); return g;
}
const people = [];
// 5 个有名居民的家(网格坐标中心)
const NAMED = {"安镇":[4.5,4.2],"周老师":[12.5,4.2],"赵医生":[20.5,4.2],"孙裁缝":[28.5,4.2],
  "李大姐":[36.5,4.2],"孙有财":[2.5,28.5]};
Object.entries(NAMED).forEach(([n,gp],i)=>{
  const [x,z] = W2W(gp[0], gp[1]); const p = person(PCOL[i]); p.position.set(x,0,z);
  p.userData = {name:n, home:[x,z]}; people.push(p);
});
for (let i=people.length;i<25;i++) {
  const h = HOMES[i%HOMES.length]; const cx=(h[0]+h[2])/2, cy=(h[1]+h[3])/2;
  const [x,z] = W2W(cx,cy); const p = person(PCOL[i%25]);
  p.position.set(x,0,z); p.userData = {name:"镇民"+i, home:[x,z], ph:i*1.37}; people.push(p);
}
// 人名标签(画布纹理 sprite)
function label(txt, color="#ffd76e") {
  const cv = document.createElement("canvas"); cv.width=256; cv.height=72;
  const c = cv.getContext("2d");
  c.font = "bold 44px 'Noto Sans SC', sans-serif"; c.textAlign="center"; c.textBaseline="middle";
  c.shadowColor="rgba(0,0,0,0.9)"; c.shadowBlur=10;
  c.fillStyle=color; c.fillText(txt,128,38);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
  sp.scale.set(6.4,1.8,1); return sp;
}

// ---------- 运镜与灯光时间轴 ----------
const nT = {          // 句子开始时刻(与 narration timeline 对齐)
  n00:0.0, n04:14.9, n05:19.6, n06:25.9, n07:31.3, n08:35.4, n09:38.3, n10:41.2, n11:44.0, n12:47.0
};
const lerp=(a,b,u)=>a+(b-a)*u, ease=u=>u*u*(3-2*u);
function camAt(t) {
  if (t < nT.n04) {                       // 黎明前缓缓升起: 低角度 → 半高
    const u = ease(t/nT.n04);
    return [lerp(-38,-24,u), lerp(14,60,u), lerp(64,74,u), 0,4,0];
  } else if (t < nT.n05) {                // 全镇亮相: 拉远到全景
    const u = ease((t-nT.n04)/(nT.n05-nT.n04));
    return [lerp(-24,-6,u), lerp(60,86,u), lerp(74,92,u), 0,0,6];
  } else if (t < nT.n11-2.2) {            // 推近邮局: 落到中街平视邮局正脸
    const u = ease((t-nT.n05)/(nT.n11-2.2-nT.n05));
    return [lerp(-6,-46.5,u), lerp(86,13,u), lerp(92,15,u), lerp(0,-46.5,u), lerp(6,4,u), lerp(0,-5,u)];
  } else {                                // 收尾拉升 → 大俯瞰(衔接 2D 地图)
    const u = ease((t-(nT.n11-2.2))/(46.7-(nT.n11-2.2)));
    return [lerp(-46.5,0,u), lerp(13,124,u), lerp(15,20,u), lerp(-46.5,0,u), lerp(4,0,u), lerp(-5,-2,u)];
  }
}
function personWalk(p, t) {               // 简单踱步: 沿家旁道路来回
  const u = p.userData; const w = Math.sin(t*0.35 + (u.ph||0)) * 4;
  p.position.x = u.home[0] + w;
  p.position.z = u.home[1] + (u.ph ? Math.cos(t*0.22+u.ph)*1.6 : 0);
  p.rotation.y = Math.cos(t*0.35 + (u.ph||0)) > 0 ? Math.PI/2 : -Math.PI/2;
  p.position.y = Math.abs(Math.sin(t*6 + (u.ph||0)))*0.12;
}
function renderAt(t) {
  // 灯光: n04 前夜色→日出, n04-n05 天光渐亮
  const dawn = Math.min(1, Math.max(0, (t-10.5)/5.5));
  hemi.intensity = lerp(0.25, 0.95, dawn);
  sun.intensity = lerp(0.05, 1.6, dawn);
  amb.intensity = lerp(0.06, 0.28, dawn);
  skyDome.material.color.setScalar(lerp(0.12, 1.0, dawn));
  scene.fog.color.setScalar(lerp(0.09, 0.85, dawn));
  const [x,y,z,lx,ly,lz] = camAt(t);
  cam.position.set(x,y,z); cam.lookAt(lx,ly,lz);
  people.forEach(p=>personWalk(p,t));
  // 安镇走向邮局 (n05-n07): 老宅 → 西大道 → 邮局门口
  const az = people.find(p=>p.userData.name=="安镇");
  if (t >= nT.n05 && t < nT.n07) {
    const u = ease((t-nT.n05)/(nT.n07-nT.n05));
    const [hx,hz] = az.userData.home, [px,pz] = [postbox.x, postbox.z+postbox.d/2+1.5];
    const viaX = hx < px ? hx : px;                        // 折线: 先东到邮局上方再南下
    const uu = u*2;
    if (uu < 1) az.position.set(lerp(hx,px,uu), az.position.y, hz);
    else az.position.set(px, az.position.y, lerp(hz,pz,uu-1));
    az.position.y = Math.abs(Math.sin(t*6))*0.12;
  } else if (t >= nT.n07) { az.position.set(postbox.x, az.position.y, postbox.z+postbox.d/2+1.5); }
  // 邮局红框脉冲 n05 起
  flagC.material.emissive.setHex(t>=nT.n05 && (t*3)%1<0.5 ? 0xaa2222 : 0x441010);
  // 三目击者 n05 起走向邮局前站位(碎片台词在合成层绘制)
  const wit = [["n08","李大姐",-49.5,0.5],["n09","赵医生",-43.5,0.5],["n10","周老师",-46.5,1.0]];
  for (const [k,nm,tx,tz] of wit) {
    const p = people.find(q=>q.userData.name==nm);
    if (t >= nT.n05) {
      const u = Math.min(1, ease((t-nT.n05)/(nT[k]-nT.n05)));
      const [hx,hz] = p.userData.home;
      p.position.x = lerp(hx, tx, u); p.position.z = lerp(hz, tz, u);
      p.rotation.y = u<1 ? Math.PI/2 : 0;
    }
    if (t >= nT[k] && t < nT[k]+0.8) p.position.y = Math.abs(Math.sin(t*8))*0.15;
  }
  mill.rotation.z = t*0.35;
  renderer.render(scene, cam);
}
window.renderAt = renderAt;

// ---------- 逐帧捕获 ----------
async function capture() {
  const q = new URLSearchParams(location.search);
  const fps = 30, dur = 46.7, N = Math.round(dur*fps)+1;
  for (let i=0;i<N;i++) {
    renderAt(i/fps);
    const png = renderer.domElement.toDataURL("image/png");
    await fetch(`http://127.0.0.1:8777/frame/${i}`, {method:"POST", body:png});
    if (i%60===0) console.log("frame", i, "/", N);
  }
  await fetch("http://127.0.0.1:8777/done", {method:"POST"});
}
if (new URLSearchParams(location.search).get("capture")) {
  document.fonts.ready.then(()=>capture());
} else {
  let t = parseFloat(new URLSearchParams(location.search).get("t")||"20");
  renderAt(t);
}
</script>
</body></html>
