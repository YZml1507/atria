<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<title>安镇实验展厅 · Atria</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background:#0d0f14; color:#dfe3ea; font:14px/1.5 "Noto Sans SC","PingFang SC",sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0; }
  canvas { display:block; }
  #hud { position:absolute; top:14px; left:16px; z-index:5; }
  #hud h1 { font-size:19px; font-weight:600; letter-spacing:.5px; }
  #hud .sub { color:#8b93a3; font-size:12px; margin-top:2px; }
  #tabs { display:flex; gap:6px; margin-top:10px; }
  .tab { padding:5px 12px; border-radius:7px; background:#171b24; border:1px solid #262c3a;
         cursor:pointer; font-size:12.5px; color:#aab2c0; }
  .tab.on { background:#2b4a7a; border-color:#3f6db5; color:#fff; }
  .tab .n { color:#7fd17f; font-weight:600; }
  #curve { position:absolute; top:14px; right:330px; z-index:5; text-align:right;
           background:#141821cc; border:1px solid #262c3a; border-radius:9px; padding:8px 12px; }
  #curve .big { font-size:22px; font-weight:700; color:#7fd17f; }
  #curve .lbl { font-size:11px; color:#8b93a3; }
  #curve canvas { display:block; margin-top:4px; }
  #panel { position:absolute; top:0; right:0; width:316px; height:100%;
           background:#11141bd9; border-left:1px solid #232838; padding:14px; z-index:6;
           overflow-y:auto; backdrop-filter:blur(6px); }
  #panel h2 { font-size:15px; }
  #panel .role { color:#8b93a3; font-size:12px; }
  #panel .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:9px;
                background:#233041; color:#9fc4ff; margin:6px 6px 0 0; }
  #panel .tag.inf { background:#2c4a2c; color:#7fd17f; }
  #panel .persona { font-size:12px; color:#b7bfcc; margin-top:10px; padding:9px;
                    background:#171c26; border-radius:7px; border-left:3px solid #3f6db5; }
  #memlist { margin-top:10px; }
  .mrow { font-size:11.5px; padding:6px 8px; margin:5px 0; background:#171c26; border-radius:6px;
          border-left:2px solid #39415a; color:#b7bfcc; }
  .mrow .d { color:#5f6b82; font-size:10.5px; margin-right:6px; }
  .mrow.tell { border-left-color:#7fd17f; }
  .mrow.think { border-left-color:#b58f3f; }
  #tlinfo { color:#8b93a3; font-size:11.5px; margin-top:14px; }
  #ctrl { position:absolute; left:0; right:316px; bottom:0; height:56px; z-index:6;
          background:#10131add; border-top:1px solid #232838; display:flex; align-items:center;
          gap:12px; padding:0 18px; backdrop-filter:blur(6px); }
  #ctrl button { background:#2b4a7a; color:#fff; border:0; border-radius:7px; padding:6px 16px;
                 font-size:13px; cursor:pointer; }
  #ctrl button.ghost { background:#1c2230; color:#aab2c0; }
  #slider { flex:1; -webkit-appearance:none; height:6px; background:#262c3a; border-radius:3px; }
  #slider::-webkit-slider-thumb { -webkit-appearance:none; width:15px; height:15px;
                 border-radius:50%; background:#4d8dff; cursor:pointer; }
  #daylab { font-variant-numeric:tabular-nums; color:#c8d0de; min-width:130px; font-size:12.5px; }
  #hint { color:#5f6b82; font-size:11px; }
  @media (max-width: 820px) {
    #hud h1 { font-size:15px; }
    #hud .sub { font-size:10.5px; }
    #tabs { flex-wrap:wrap; gap:4px; max-width:60vw; }
    .tab { padding:3px 8px; font-size:10.5px; }
    #curve { right:10px; top:auto; bottom:66px; padding:5px 9px; }
    #curve .big { font-size:16px; }
    #curve .lbl { font-size:9.5px; }
    #panel { top:auto; left:0; right:0; bottom:56px; width:100%; height:38vh;
             border-left:0; border-top:1px solid #232838; padding:10px; }
    #ctrl { right:0; height:56px; padding:0 10px; gap:8px; }
    #daylab { min-width:96px; font-size:11px; }
    #hint { display:none; }
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud">
  <h1>安镇 · 信息传播实验展厅</h1>
  <div class="sub">25 个 LLM 居民 · 同引擎同种子 · 只差一个变量</div>
  <div id="tabs"></div>
</div>
<div id="curve">
  <div class="big" id="knowN">0<span style="font-size:13px;color:#8b93a3">/25</span></div>
  <div class="lbl">知情人数 · 拖动时间轴回放</div>
  <canvas id="spark" width="240" height="44"></canvas>
</div>
<div id="panel"><h2>点一个居民看记忆</h2><div class="role">移动中角色头顶气泡是 run 里的真实台词</div></div>
<div id="ctrl">
  <button id="playBtn">▶ 播放</button>
  <button class="ghost" id="spdBtn">8×</button>
  <input id="slider" type="range" min="0" max="1000" value="0">
  <span id="daylab">第 1 天</span>
  <span id="hint">拖时间轴 · 滚轮缩放 · 点人看记忆</span>
</div>
<script src="hall.js"></script>
</body>
</html>
